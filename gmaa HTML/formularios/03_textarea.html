<h2>Formulario con text area</h2>

<form action="" method="post">
  Ingresa tu nombre:
  <input type="text" name="nombre">
  <br>
  Ingresa tu correo:
  <!-- type="email": el navegador valida que el texto tenga formato de correo (con @) -->
  <input type="email" name="correo">
  <br>
  Ingresa tus comentarios:
  <!-- textarea: caja de texto de varias líneas.
       rows: número de líneas visibles.
       cols: ancho en caracteres.
       A diferencia de input, lleva etiqueta de cierre. -->
  <textarea name="comentarios" rows="1" cols="10"></textarea>
  <br>
  <input type="submit" value="enviar">
  <input type="reset" value="borrar">
</form>

</body>
